[package]
name = "bunko-reader"
version = "0.1.0"
description = "Hyper-fast, local-first Light Novel desktop reader"
authors = ["BunkoReader Team"]
license = "MIT"
edition = "2021"

[lib]
name = "bunko_reader_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
memmap2 = "0.9"
rayon = "1.10"
ammonia = "4.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dashmap = "6.1"
thiserror = "2.0"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4"] }
parking_lot = "0.12"
url = "2.5"
urlencoding = "2.1"
